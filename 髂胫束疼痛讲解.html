<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mm=a=>new THREE.Vector3(a[0]*0.01,a[1]*0.01,a[2]*0.01);
const viewer=document.getElementById('viewer'),canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,0.05,200);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=2;controls.maxDistance=40;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f96,0.65));
const kl=new THREE.DirectionalLight(0xffffff,1.0);kl.position.set(-6,10,8);scene.add(kl);
const fl=new THREE.DirectionalLight(0xffffff,0.45);fl.position.set(8,4,6);scene.add(fl);
const bl=new THREE.DirectionalLight(0xdfeefa,0.5);bl.position.set(-2,6,-10);scene.add(bl);

// ---------- 数据 ----------
const loading=document.getElementById('loading');
let meta,buf;
try{
  let b64;
  if(window.__ANAT_META__){meta=window.__ANAT_META__;b64=window.__ANAT_B64__;}
  else{meta=await (await fetch('data/anat.json')).json();
    const r=await fetch('data/anat.b64.txt');if(!r.ok)throw new Error(r.status);b64=await r.text();}
  const bin=atob(b64.replace(/\s+/g,''));
  const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);buf=u8.buffer;
}catch(e){loading.textContent='模型加载失败，请刷新重试';return;}
loading.hidden=true;

const BONES=['hip','hipL','sacrum','l5','femur','tibia','fibula','patella','talus','calc'];
const MUSCLE_SHADE={tfl:0xc2493d,gmax:0xb03f37,gmed:0xbe4a3e,gmin:0xa93c35,vl:0xb8433a,vi:0xa63a33,vm:0xb8433a,rf:0xbf473d,sart:0xb24139,bfl:0xa43b35,bfs:0xa93d36,st:0xad3f37,sm:0xa33a34,gasl:0xb3423a,gasm:0xb3423a,ta:0xbb463c,fl:0xb5443b,sol:0xa93d36,addm:0xa53b34,addl:0xae3f37,grac:0xb2423a};

function fiberize(mat,axis,amp,period){
  const a=axis.clone().normalize();
  const ref=Math.abs(a.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  const u1=new THREE.Vector3().crossVectors(a,ref).normalize(),u2=new THREE.Vector3().crossVectors(a,u1).normalize();
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uU1={value:u1};sh.uniforms.uU2={value:u2};sh.uniforms.uAmp={value:amp};sh.uniforms.uF={value:2*Math.PI/period};
    sh.vertexShader='varying vec3 vWP;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;');
    sh.fragmentShader='varying vec3 vWP;uniform vec3 uU1;uniform vec3 uU2;uniform float uAmp;uniform float uF;\n'+sh.fragmentShader.replace('#include <color_fragment>',
      '#include <color_fragment>\nfloat s1=abs(sin(dot(vWP,uU1)*uF));float s2=abs(sin(dot(vWP,uU2)*uF*1.13+1.7));diffuseColor.rgb*=1.0-uAmp*(1.0-s1*s2);');
  };
}
function pca(pos){
  const n=pos.length/3;let cx=0,cy=0,cz=0;for(let i=0;i<n;i++){cx+=pos[i*3];cy+=pos[i*3+1];cz+=pos[i*3+2];}cx/=n;cy/=n;cz/=n;
  let xx=0,xy=0,xz=0,yy=0,yz=0,zz=0;
  for(let i=0;i<n;i++){const x=pos[i*3]-cx,y=pos[i*3+1]-cy,z=pos[i*3+2]-cz;xx+=x*x;xy+=x*y;xz+=x*z;yy+=y*y;yz+=y*z;zz+=z*z;}
  let v=new THREE.Vector3(0.1,1,0.1);
  for(let k=0;k<30;k++){v=new THREE.Vector3(xx*v.x+xy*v.y+xz*v.z,xy*v.x+yy*v.y+yz*v.z,xz*v.x+yz*v.y+zz*v.z).normalize();}
  return {c:new THREE.Vector3(cx,cy,cz),axis:v};
}

const P={};
const mn=meta.min,mx=meta.max;
for(const p of meta.parts){
  const q=new Int16Array(buf,p.vo,p.vn*3);const pos=new Float32Array(p.vn*3);
  for(let i=0;i<p.vn*3;i++){const ax=i%3;pos[i]=((q[i]+32767)/65534*(mx[ax]-mn[ax])+mn[ax])*0.01;}
  const idx=new Uint32Array(buf,p.io,p.in);
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setIndex(new THREE.BufferAttribute(idx,1));g.computeVertexNormals();
  const info=pca(pos);
  let m;
  if(p.k==='arms'&&P.skin){m=P.skin.mat;}
  else if(p.k==='skin'){
    m=new THREE.MeshStandardMaterial({color:0xe8b89c,roughness:.55,transparent:true,depthWrite:false});
    m.userData.op={value:.4};
    m.onBeforeCompile=sh=>{sh.uniforms.uOp=m.userData.op;
      sh.fragmentShader='uniform float uOp;\n'+sh.fragmentShader.replace('#include <dithering_fragment>','#include <dithering_fragment>\nfloat rim=1.0-abs(dot(normal,normalize(vViewPosition)));gl_FragColor.a=clamp(uOp*(0.28+1.7*pow(rim,2.4)),0.0,0.92);');};
  }else if(p.k==='itb'){
    m=new THREE.MeshStandardMaterial({color:0x9bb6da,roughness:.3,metalness:.22,side:THREE.DoubleSide});
    fiberize(m,info.axis,.22,0.022);
  }else if(BONES.includes(p.k)){
    m=new THREE.MeshStandardMaterial({color:0xe4d4b2,roughness:.7});
  }else{
    m=new THREE.MeshStandardMaterial({color:MUSCLE_SHADE[p.k]||0xb8433a,roughness:.5,side:THREE.DoubleSide});
    fiberize(m,info.axis,.28,0.03);
  }
  if(!m.userData.base)m.userData.base=m.color.clone();
  const mesh=new THREE.Mesh(g,m);mesh.userData.k=p.k;
  if(p.k==='skin'||p.k==='arms')mesh.renderOrder=6;
  if(p.k==='itb')mesh.renderOrder=4;
  scene.add(mesh);
  P[p.k]={mesh,mat:m,pos,base:pos.slice(),kind:(p.k==='skin'||p.k==='arms')?'skin':p.k==='itb'?'fascia':BONES.includes(p.k)?'bone':'muscle'};
}

// 脂肪垫（示意，位于髂胫束与股骨外上髁之间）
const A=meta.anchors;
const PAD=[A.epi[0]-3,A.epi[1]+1,A.epi[2]+6];
const padMat=new THREE.MeshStandardMaterial({color:0xefc54a,roughness:.45});padMat.userData.base=padMat.color.clone();
const pad=new THREE.Mesh(new THREE.SphereGeometry(1,32,20),padMat);pad.scale.set(.04,.1,.12);pad.position.copy(mm(PAD));scene.add(pad);
P.pad={mesh:pad,mat:padMat,kind:'fat'};pad.userData.k='pad';

// 刺激光晕
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);

  body:`<p>右臀中肌拉不住，跷跷板失衡，没有腿撑着的<b>左边就往下掉</b>。下面可以在「有力」和「无力」之间切换对比。</p>
  <p>「对侧骨盆下沉」里的「对侧」，指的是<b>站着那条腿的对面</b>：右脚站，掉的是左边；左脚站，掉的是右边。医生检查时管这个叫 <b>Trendelenburg 征</b>。</p>
  <p>看画面上的两条线：虚线是水平线，红线连着左右两边的骨盆。骨盆一歪，两条线就张开一个角度。同时右大腿被带着往里收，右膝往里扣。</p>
  <p class="warn"><b>不是一直歪着。</b>只有右脚单独着地、左脚悬在空中的那一下会掉，左脚一落地就回平。跑步时一步一次，平一下、斜一下。掉的时候左脚在空中，不会比右脚低，腿长也没变。动画把角度放大到约 9°，真实情况通常只有几度。</p>
  <p class="note">自查：对着镜子右脚单脚站 30 秒，或者做右腿单腿下蹲。正常时两边胯一样高；如果左边胯往下掉、右膝往里扣，说明右臀中肌偏弱。在跑步视频里看起来像屁股左右扭。</p>`},

  labels:[['itbMid','髂胫束被拉紧','hot',-160,10],['tfl','阔筋膜张肌替班，也在拽','act',60,-30],['gmed','臀中肌没力','act',-150,-40],['kneeIn','右膝往里扣','hot',-150,30]],
  body:`<p>髂胫束上端挂在<b>右侧骨盆</b>，下端挂在<b>膝盖外侧</b>，像一根贴着大腿外侧的弦。骨盆往左歪时，有两件事让它变紧：</p>
  <ul><li><b>弦被拉长了。</b>骨盆左倾，右大腿相对骨盆往里收、膝盖往里扣，大腿外侧被撑开，上下两个挂点离得更远，髂胫束像拉弓时的弓弦一样被绷紧。示意图里的虚线是它原来的位置。</li>
  <li><b>有人替班还在拽。</b>臀中肌没力时，同样能把腿往外撑的<span class="act">阔筋膜张肌</span>会去替它干活。可阔筋膜张肌的下端接的就是髂胫束，它越用力，髂胫束被拽得越紧。</li></ul>
  <p>绷得更紧的髂胫束，在膝外侧压脂肪垫的力也更大。每次右脚落地都重复一次，所以臀中肌弱的人更容易得髂胫束综合征。</p>
  <p class="note">其他会加重的情况：跑量涨得太快、下坡下楼、倾斜路面、步幅过大、骑行座位不合适。</p>`},
